# Standalone file: do not merge into the production project/volumes.
name: sequo-staging
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    image: ${SEQUO_API_IMAGE:?required}
    env_file:
      - ${SEQUO_STAGING_ENV_FILE:-.env.staging}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SEQUO_RELEASE_ID: ${SEQUO_RELEASE_ID:?required}
        SEQUO_SOURCE_REVISION: ${SEQUO_SOURCE_REVISION:?required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      NOTIFICATION_TOKEN_ENCRYPTION_SECRET: ${NOTIFICATION_TOKEN_ENCRYPTION_SECRET:?required}
      ADMIN_CODE_ENCRYPTION_SECRET: ${ADMIN_CODE_ENCRYPTION_SECRET:?required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      SEQUO_ALLOW_DEV_DEFAULTS: "false"
    ports:
      - "127.0.0.1:${SEQUO_API_PORT:-55828}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  staging-postgres:
