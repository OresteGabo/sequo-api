name: CI/CD

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: ci_only_sequo_auth_secret_2026_change_me
      NOTIFICATION_TOKEN_ENCRYPTION_SECRET: ci_only_sequo_notification_secret_2026_change_me
      GOOGLE_CLIENT_ID: ci_google_client_id
      FACEBOOK_APP_ID: ci_facebook_app_id
      APPLE_CLIENT_ID: ci_apple_client_id

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Show Gradle environment
        run: ./gradlew --version --no-daemon

      - name: Build and run tests
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sequo-api-test-reports-${{ github.run_attempt }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 14

      - name: Upload boot JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: sequo-api-boot-jar-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 30

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sequo-api:ci

  postgres-migration-validation:
    name: PostgreSQL Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sequo_test
          POSTGRES_USER: sequo
          POSTGRES_PASSWORD: sequo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sequo -d sequo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sequo_test
      SPRING_DATASOURCE_USERNAME: sequo
      SPRING_DATASOURCE_PASSWORD: sequo_test_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SEQUO_ALLOW_DEV_DEFAULTS: true
      JWT_SECRET: ci_only_sequo_auth_secret_2026_change_me
      NOTIFICATION_TOKEN_ENCRYPTION_SECRET: ci_only_sequo_notification_secret_2026_change_me
      GOOGLE_CLIENT_ID: ci_google_client_id
      FACEBOOK_APP_ID: ci_facebook_app_id
      APPLE_CLIENT_ID: ci_apple_client_id

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Validate migrations against PostgreSQL
        run: ./gradlew test --tests dev.orestegabo.sequo_api.SequoApiApplicationTests --no-daemon --stacktrace

  deploy-production:
    name: Deploy to Production Host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-test
      - docker-build
      - postgres-migration-validation
    environment:
      name: production
      url: https://api.sequoservice.com/actuator/health
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}

    steps:
      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy latest main branch
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -p "${DEPLOY_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_DIR='${DEPLOY_APP_DIR:-/root/sequo-api}' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd "${APP_DIR}"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          docker compose ps
          curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:8080/actuator/health/readiness
          REMOTE_DEPLOY

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://api.sequoservice.com/actuator/health

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
