version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
          - org.jetbrains.kotlin.*
      spring:
        patterns:
          - org.springframework.boot*
          - io.spring.dependency-management
      jwt:
        patterns:
          - io.jsonwebtoken*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
