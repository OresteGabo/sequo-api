spring.application.name=sequo-api-test

# Test database defaults. Main app runs use local PostgreSQL, but tests stay isolated in H2.
spring.datasource.url=jdbc:h2:mem:sequodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

sequo.auth.jwt.secret=${JWT_SECRET:sequo_auth_dev_secret_key_2026_v1}
sequo.auth.jwt.access-expiration=3600000
sequo.auth.jwt.refresh-expiration=2592000000
sequo.auth.refresh-session-cleanup.enabled=false
sequo.auth.refresh-session-cleanup.fixed-delay-ms=86400000

sequo.security.cors.allowed-origins=
sequo.security.allow-dev-defaults=true

sequo.auth.google.client-id=${GOOGLE_CLIENT_ID:google_dev_client_id}
sequo.auth.google.allowed-client-ids=${GOOGLE_ALLOWED_CLIENT_IDS:${GOOGLE_ANDROID_CLIENT_ID:543119759762-f4s16bdo6sjhqsbk15na7df96dib6kmo.apps.googleusercontent.com},${GOOGLE_IOS_CLIENT_ID:543119759762-ehcnb5lpi883c94457ogrgqsd0nshde2.apps.googleusercontent.com}}
sequo.auth.facebook.app-id=${FACEBOOK_APP_ID:facebook_dev_app_id}
sequo.auth.apple.client-id=${APPLE_CLIENT_ID:apple_dev_client_id}

sequo.notifications.token-encryption-secret=${NOTIFICATION_TOKEN_ENCRYPTION_SECRET:sequo_notifications_dev_encryption_key_2026_change_before_prod}
sequo.notifications.outbox-worker.enabled=false
sequo.notifications.outbox-worker.fixed-delay-ms=30000
sequo.notifications.outbox-worker.limit=20

sequo.wallets.yas-togo.api-key=${YAS_TOGO_API_KEY:yas_togo_dev_api_key_2026_change_before_prod}
sequo.wallets.yas-togo.webhook-secret=${YAS_TOGO_WEBHOOK_SECRET:yas_togo_dev_webhook_secret_2026_change_before_prod}
sequo.wallets.moov-africa.api-key=${MOOV_AFRICA_API_KEY:moov_africa_dev_api_key_2026_change_before_prod}
sequo.wallets.moov-africa.webhook-secret=${MOOV_AFRICA_WEBHOOK_SECRET:moov_africa_dev_webhook_secret_2026_change_before_prod}

sequo.relay.delayed-parcel-scheduler.enabled=false
sequo.relay.delayed-parcel-scheduler.fixed-delay-ms=3600000
sequo.settlements.eligibility-scheduler.enabled=false
sequo.settlements.eligibility-scheduler.fixed-delay-ms=3600000
