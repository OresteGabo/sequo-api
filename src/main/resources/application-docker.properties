server.port=${PORT:8080}

# Docker Compose uses PostgreSQL by default.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sequo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sequo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sequo_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=true

# Expose only operational health/info in Docker. Sensitive Actuator endpoints stay disabled.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Docker images fail closed by default. Local Compose and CI can set this to true
# when intentionally using development-only placeholder configuration.
sequo.security.allow-dev-defaults=${SEQUO_ALLOW_DEV_DEFAULTS:false}

# The Docker profile must receive explicit secrets from the container environment.
sequo.auth.jwt.secret=${JWT_SECRET:}
sequo.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

sequo.auth.google.client-id=${GOOGLE_CLIENT_ID:google_docker_dev_client_id}
sequo.auth.facebook.app-id=${FACEBOOK_APP_ID:facebook_docker_dev_app_id}
sequo.auth.apple.client-id=${APPLE_CLIENT_ID:apple_docker_dev_client_id}

sequo.notifications.token-encryption-secret=${NOTIFICATION_TOKEN_ENCRYPTION_SECRET:}
sequo.wallets.yas-togo.api-key=${YAS_TOGO_API_KEY:}
sequo.wallets.yas-togo.webhook-secret=${YAS_TOGO_WEBHOOK_SECRET:}
sequo.wallets.moov-africa.api-key=${MOOV_AFRICA_API_KEY:}
sequo.wallets.moov-africa.webhook-secret=${MOOV_AFRICA_WEBHOOK_SECRET:}
