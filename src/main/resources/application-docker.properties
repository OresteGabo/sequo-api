server.port=${PORT:8080}

# Docker Compose uses PostgreSQL by default.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sequo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sequo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sequo_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=true

# Expose only operational health/info in Docker. Sensitive Actuator endpoints stay disabled.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Docker images fail closed by default. Local Compose and CI can set this to true
# when intentionally using development-only placeholder configuration.
sequo.security.allow-dev-defaults=${SEQUO_ALLOW_DEV_DEFAULTS:false}

# The Docker profile must receive explicit secrets from the container environment.
sequo.auth.jwt.secret=${JWT_SECRET:}
sequo.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

sequo.auth.google.client-id=${GOOGLE_CLIENT_ID:google_docker_dev_client_id}
sequo.auth.google.allowed-client-ids=${GOOGLE_ALLOWED_CLIENT_IDS:${GOOGLE_ANDROID_SEQUO_CLIENT_ID:543119759762-k7d6pjd4l24jf1pac78idfrffimq2ia9.apps.googleusercontent.com},${GOOGLE_ANDROID_HUB_CLIENT_ID:543119759762-52m435uh8qjsph62n3fisl82id238a4d.apps.googleusercontent.com},${GOOGLE_ANDROID_RIDER_CLIENT_ID:543119759762-3mn29752v5srgi1m75c262jugufvg7pa.apps.googleusercontent.com},${GOOGLE_ANDROID_VENDOR_CLIENT_ID:543119759762-j5ellp5rq860eu8nvllm19uciddvigeb.apps.googleusercontent.com},${GOOGLE_IOS_SEQUO_CLIENT_ID:543119759762-ehcnb5lpi883c94457ogrgqsd0nshde2.apps.googleusercontent.com},${GOOGLE_IOS_HUB_CLIENT_ID:543119759762-ce5kjn04a8bu487r83e5ru3mu291mfjk.apps.googleusercontent.com},${GOOGLE_IOS_RIDER_CLIENT_ID:543119759762-6bgv32vtn9gigcqdhraocrh02576i8l8.apps.googleusercontent.com},${GOOGLE_IOS_VENDOR_CLIENT_ID:543119759762-i32k35p3aku6ap9busskcvabqg1hvjj6.apps.googleusercontent.com},${GOOGLE_WEB_CLIENT_ID:543119759762-5vi3qqvr26o3adoqe7v68stbic1vh2i2.apps.googleusercontent.com},${GOOGLE_WEB_HUB_CLIENT_ID:},${GOOGLE_WEB_RIDER_CLIENT_ID:},${GOOGLE_WEB_VENDOR_CLIENT_ID:}}
sequo.auth.facebook.app-id=${FACEBOOK_APP_ID:facebook_docker_dev_app_id}
sequo.auth.apple.client-id=${APPLE_CLIENT_ID:apple_docker_dev_client_id}

sequo.notifications.token-encryption-secret=${NOTIFICATION_TOKEN_ENCRYPTION_SECRET:}
sequo.wallets.yas-togo.api-key=${YAS_TOGO_API_KEY:}
sequo.wallets.yas-togo.webhook-secret=${YAS_TOGO_WEBHOOK_SECRET:}
