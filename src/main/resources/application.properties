spring.application.name=sequo-api

# Passwordless admin entry is opt-in and limited by independent local-fixture startup/request guards.
sequo.admin.local-access.enabled=${SEQUO_LOCAL_ADMIN_ENABLED:false}
sequo.admin.local-access.environment=${SEQUO_LOCAL_ADMIN_ENVIRONMENT:}
sequo.admin.local-access.user-id=${SEQUO_LOCAL_ADMIN_USER_ID:}
spring.config.import=optional:file:./application-secret.properties
server.port=${PORT:8082}

# Database Configuration (local PostgreSQL for app runs)
# Tests override these values from src/test/resources/application.properties.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sequo_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oreste}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Return eligibility is based on persisted handoff time. Add category exclusions only after SEQUO approval.
sequo.returns.window-hours=${RETURN_WINDOW_HOURS:72}
sequo.returns.excluded-categories=${RETURN_EXCLUDED_CATEGORIES:}
sequo.returns.click-and-collect-mode=${RETURN_CLICK_AND_COLLECT_MODE:PENDING}

# Signed MVP bargaining defaults; SEQUO may configure attempts and accepted-price validity.
sequo.bargaining.max-customer-attempts=${BARGAINING_MAX_CUSTOMER_ATTEMPTS:3}
sequo.bargaining.max-merchant-attempts=${BARGAINING_MAX_MERCHANT_ATTEMPTS:3}
sequo.bargaining.accepted-price-lock-hours=${BARGAINING_ACCEPTED_PRICE_LOCK_HOURS:24}

# Authentication Security
sequo.auth.jwt.secret=${JWT_SECRET:sequo_auth_dev_secret_key_2026_v1}
# Preserve the existing local encryption key; strict profiles require an explicit approved distinct value.
sequo.admin-auth.code-encryption-secret=${ADMIN_CODE_ENCRYPTION_SECRET:sequo_admin_auth_code_secret_2026_change_before_prod}
sequo.auth.jwt.access-expiration=3600000
sequo.auth.jwt.refresh-expiration=2592000000
sequo.auth.refresh-session-cleanup.enabled=${REFRESH_SESSION_CLEANUP_ENABLED:false}
sequo.auth.refresh-session-cleanup.fixed-delay-ms=${REFRESH_SESSION_CLEANUP_FIXED_DELAY_MS:86400000}

# Local development may leave this empty. Production-like profiles must set explicit HTTPS origins.
sequo.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Social Auth Providers
sequo.auth.google.client-id=${GOOGLE_CLIENT_ID:google_dev_client_id}
sequo.auth.google.allowed-client-ids=${GOOGLE_ALLOWED_CLIENT_IDS:\
  ${GOOGLE_ANDROID_SEQUO_CLIENT_ID:92804430098-q66d842cprjnae9eats5l81ja95hgdoo.apps.googleusercontent.com},\
  ${GOOGLE_ANDROID_HUB_CLIENT_ID:92804430098-q08picq9iq0jva1r36mt0l4949bp1g0a.apps.googleusercontent.com},\
  ${GOOGLE_ANDROID_RIDER_CLIENT_ID:92804430098-v61abcpu5j2cmjfhkonareuvcmm89l5c.apps.googleusercontent.com},\
  ${GOOGLE_ANDROID_VENDOR_CLIENT_ID:92804430098-76jrvmovg3c3jcsjgre14kgf05q1bdq9.apps.googleusercontent.com},\
  ${GOOGLE_IOS_SEQUO_CLIENT_ID:92804430098-q92ufo08vjdsu285cek8993os6tgv2gl.apps.googleusercontent.com},\
  ${GOOGLE_IOS_HUB_CLIENT_ID:92804430098-7b5av9tn51hls6qi6a7ucooshefk8m6i.apps.googleusercontent.com},\
  ${GOOGLE_IOS_RIDER_CLIENT_ID:92804430098-76fv9fnb868enoqhpf9v954rvuogfhqk.apps.googleusercontent.com},\
  ${GOOGLE_IOS_VENDOR_CLIENT_ID:92804430098-i4cgn00aec11rsfqgds56scv257s5gkt.apps.googleusercontent.com},\
  ${GOOGLE_WEB_CLIENT_ID:92804430098-g2dg1d3i931s4ji0m6j8n1fpf6qpeip9.apps.googleusercontent.com},\
  ${GOOGLE_WEB_HUB_CLIENT_ID:92804430098-s12kjg7k9tvnlh19ag915up4v83v6rc6.apps.googleusercontent.com},\
  ${GOOGLE_WEB_RIDER_CLIENT_ID:92804430098-8ee9e3e7p65eo4uonm5nhe77uoroco22.apps.googleusercontent.com},\
  ${GOOGLE_WEB_VENDOR_CLIENT_ID:92804430098-qr98tr629kap5gm0bjmb1ju9lm4n2mto.apps.googleusercontent.com}}
sequo.auth.facebook.app-id=${FACEBOOK_APP_ID:facebook_dev_app_id}
sequo.auth.facebook.app-access-token=${FACEBOOK_APP_ACCESS_TOKEN:}
sequo.auth.apple.client-id=${APPLE_CLIENT_ID:apple_dev_client_id}

# Notification Security
# Override in production. Used to encrypt FCM tokens at rest before provider dispatch is implemented.
sequo.notifications.token-encryption-secret=${NOTIFICATION_TOKEN_ENCRYPTION_SECRET:sequo_notifications_dev_encryption_key_2026_change_before_prod}
sequo.notifications.outbox-worker.enabled=${NOTIFICATION_OUTBOX_WORKER_ENABLED:false}
sequo.notifications.outbox-worker.fixed-delay-ms=${NOTIFICATION_OUTBOX_WORKER_FIXED_DELAY_MS:30000}
sequo.notifications.outbox-worker.limit=${NOTIFICATION_OUTBOX_WORKER_LIMIT:20}

# Wallet provider secrets are placeholders for the upcoming real adapters and callbacks.
sequo.wallets.yas-togo.api-base-url=${YAS_TOGO_API_BASE_URL:}
sequo.wallets.yas-togo.api-key=${YAS_TOGO_API_KEY:yas_togo_dev_api_key_2026_change_before_prod}
sequo.wallets.yas-togo.merchant-account-id=${YAS_TOGO_MERCHANT_ACCOUNT_ID:}
sequo.wallets.yas-togo.webhook-secret=${YAS_TOGO_WEBHOOK_SECRET:yas_togo_dev_webhook_secret_2026_change_before_prod}
sequo.wallets.moov-africa.api-base-url=${MOOV_AFRICA_API_BASE_URL:}
sequo.wallets.moov-africa.api-key=${MOOV_AFRICA_API_KEY:moov_africa_dev_api_key_2026_change_before_prod}
sequo.wallets.moov-africa.merchant-account-id=${MOOV_AFRICA_MERCHANT_ACCOUNT_ID:}
sequo.wallets.moov-africa.webhook-secret=${MOOV_AFRICA_WEBHOOK_SECRET:moov_africa_dev_webhook_secret_2026_change_before_prod}

# Operational jobs are disabled by default until the deployment owner explicitly enables them.
sequo.relay.delayed-parcel-scheduler.enabled=${RELAY_DELAYED_PARCEL_SCHEDULER_ENABLED:false}
sequo.relay.delayed-parcel-scheduler.fixed-delay-ms=${RELAY_DELAYED_PARCEL_SCHEDULER_FIXED_DELAY_MS:3600000}
sequo.settlements.eligibility-scheduler.enabled=${SETTLEMENT_ELIGIBILITY_SCHEDULER_ENABLED:false}
sequo.settlements.eligibility-scheduler.fixed-delay-ms=${SETTLEMENT_ELIGIBILITY_SCHEDULER_FIXED_DELAY_MS:3600000}

# Product photo uploads are restricted to the merchant camera route.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Explicit new choices are disabled until SEQUO configures its coverage and ETA promises.
# The existing unspecified-mode checkout remains supported.
sequo.delivery.zone-id=${DELIVERY_ZONE_ID:}
sequo.delivery.max-distance-km=${DELIVERY_MAX_DISTANCE_KM:}
sequo.delivery.modes.express.enabled=${DELIVERY_EXPRESS_ENABLED:false}
sequo.delivery.modes.express.eta-min-minutes=${DELIVERY_EXPRESS_ETA_MIN_MINUTES:}
sequo.delivery.modes.express.eta-max-minutes=${DELIVERY_EXPRESS_ETA_MAX_MINUTES:}
sequo.delivery.modes.classic.enabled=${DELIVERY_CLASSIC_ENABLED:false}
sequo.delivery.modes.classic.eta-min-minutes=${DELIVERY_CLASSIC_ETA_MIN_MINUTES:}
sequo.delivery.modes.classic.eta-max-minutes=${DELIVERY_CLASSIC_ETA_MAX_MINUTES:}
sequo.delivery.modes.deferred.enabled=${DELIVERY_DEFERRED_ENABLED:false}
sequo.delivery.modes.deferred.eta-min-minutes=${DELIVERY_DEFERRED_ETA_MIN_MINUTES:}
sequo.delivery.modes.deferred.eta-max-minutes=${DELIVERY_DEFERRED_ETA_MAX_MINUTES:}

# No example referral tariff is enabled without written business approval.
sequo.referrals.credit-cfa=${REFERRAL_CREDIT_CFA:0}
sequo.referrals.approval-reference=${REFERRAL_APPROVAL_REFERENCE:}
sequo.referrals.expiry-days=${REFERRAL_EXPIRY_DAYS:0}
