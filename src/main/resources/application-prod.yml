server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sequo}
    username: ${SPRING_DATASOURCE_USERNAME:sequo}
    password: ${SPRING_DATASOURCE_PASSWORD:sequo_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    dev.orestegabo.sequo_api: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:WARN}

sequo:
  security:
    allow-dev-defaults: ${SEQUO_ALLOW_DEV_DEFAULTS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    jwt:
      secret: ${JWT_SECRET:sequo_compose_dev_secret_key_2026_change_before_prod}
    google:
      client-id: ${GOOGLE_CLIENT_ID:google_docker_dev_client_id}
      allowed-client-ids:
        - ${GOOGLE_ANDROID_SEQUO_CLIENT_ID:543119759762-k7d6pjd4l24jf1pac78idfrffimq2ia9.apps.googleusercontent.com}
        - ${GOOGLE_ANDROID_HUB_CLIENT_ID:543119759762-52m435uh8qjsph62n3fisl82id238a4d.apps.googleusercontent.com}
        - ${GOOGLE_ANDROID_RIDER_CLIENT_ID:543119759762-3mn29752v5srgi1m75c262jugufvg7pa.apps.googleusercontent.com}
        - ${GOOGLE_ANDROID_VENDOR_CLIENT_ID:543119759762-j5ellp5rq860eu8nvllm19uciddvigeb.apps.googleusercontent.com}
        - ${GOOGLE_IOS_SEQUO_CLIENT_ID:543119759762-ehcnb5lpi883c94457ogrgqsd0nshde2.apps.googleusercontent.com}
        - ${GOOGLE_IOS_HUB_CLIENT_ID:543119759762-ce5kjn04a8bu487r83e5ru3mu291mfjk.apps.googleusercontent.com}
        - ${GOOGLE_IOS_RIDER_CLIENT_ID:543119759762-6bgv32vtn9gigcqdhraocrh02576i8l8.apps.googleusercontent.com}
        - ${GOOGLE_IOS_VENDOR_CLIENT_ID:543119759762-i32k35p3aku6ap9busskcvabqg1hvjj6.apps.googleusercontent.com}
        - ${GOOGLE_WEB_CLIENT_ID:543119759762-5vi3qqvr26o3adoqe7v68stbic1vh2i2.apps.googleusercontent.com}
        - ${GOOGLE_WEB_HUB_CLIENT_ID:543119759762-setlst6nt41hcik3kmkk64770h86kaqu.apps.googleusercontent.com}
        - ${GOOGLE_WEB_RIDER_CLIENT_ID:543119759762-fmeaucus4h8cl7f9ojaa9sjnjjl8eb1s.apps.googleusercontent.com}
        - ${GOOGLE_WEB_VENDOR_CLIENT_ID:543119759762-ep5qfncioe001l6n2e97tk6d3cviatls.apps.googleusercontent.com}
    facebook:
      app-id: ${FACEBOOK_APP_ID:facebook_docker_dev_app_id}
      app-access-token: ${FACEBOOK_APP_ACCESS_TOKEN:}
    apple:
      client-id: ${APPLE_CLIENT_ID:apple_docker_dev_client_id}
    refresh-session-cleanup:
      enabled: ${REFRESH_SESSION_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${REFRESH_SESSION_CLEANUP_FIXED_DELAY_MS:86400000}
  notifications:
    token-encryption-secret: ${NOTIFICATION_TOKEN_ENCRYPTION_SECRET:sequo_compose_notification_token_secret_2026_change_before_prod}
    outbox-worker:
      enabled: ${NOTIFICATION_OUTBOX_WORKER_ENABLED:false}
      fixed-delay-ms: ${NOTIFICATION_OUTBOX_WORKER_FIXED_DELAY_MS:30000}
      limit: ${NOTIFICATION_OUTBOX_WORKER_LIMIT:20}
    provider-delivery-worker:
      enabled: ${NOTIFICATION_PROVIDER_DELIVERY_WORKER_ENABLED:false}
      fixed-delay-ms: ${NOTIFICATION_PROVIDER_DELIVERY_WORKER_FIXED_DELAY_MS:30000}
      limit: ${NOTIFICATION_PROVIDER_DELIVERY_WORKER_LIMIT:50}
    device-token-pruning:
      enabled: ${NOTIFICATION_DEVICE_TOKEN_PRUNING_ENABLED:true}
      retention-days: ${NOTIFICATION_DEVICE_TOKEN_PRUNING_RETENTION_DAYS:90}
      fixed-delay-ms: ${NOTIFICATION_DEVICE_TOKEN_PRUNING_FIXED_DELAY_MS:86400000}
  wallets:
    yas-togo:
      api-key: ${YAS_TOGO_API_KEY:}
      webhook-secret: ${YAS_TOGO_WEBHOOK_SECRET:}
    moov-africa:
      api-key: ${MOOV_AFRICA_API_KEY:}
      webhook-secret: ${MOOV_AFRICA_WEBHOOK_SECRET:}
  relay:
    delayed-parcel-scheduler:
      enabled: ${RELAY_DELAYED_PARCEL_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${RELAY_DELAYED_PARCEL_SCHEDULER_FIXED_DELAY_MS:3600000}
  settlements:
    eligibility-scheduler:
      enabled: ${SETTLEMENT_ELIGIBILITY_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${SETTLEMENT_ELIGIBILITY_SCHEDULER_FIXED_DELAY_MS:3600000}
