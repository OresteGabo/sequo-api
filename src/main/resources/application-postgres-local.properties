# Local PostgreSQL profile for running Sequo API against a developer database.
#
# Usage:
#   SPRING_PROFILES_ACTIVE=postgres-local \
#   SPRING_DATASOURCE_PASSWORD='<local database password>' \
#   ./gradlew bootRun
#
# This profile intentionally keeps secrets in environment variables.

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sequo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oreste}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Local development can rebuild tables directly from Kotlin JPA entities.
# Production and Docker profiles keep Flyway enabled for controlled migrations.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.h2.console.enabled=false

# Local profile may use development placeholders while database integration is being tested.
sequo.security.allow-dev-defaults=true
